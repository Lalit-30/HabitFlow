version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: habittracker_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: habit_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habittracker_backend
    restart: always
    environment:
      - PROJECT_NAME=Habit Tracker API
      - API_V1_STR=/api/v1
      - SECRET_KEY=production_jwt_secret_key_habit_tracker_9988
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/habit_tracker
      - CORS_ORIGINS=["http://localhost", "http://localhost:5173", "http://localhost:80"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: habittracker_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
